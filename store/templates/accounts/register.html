{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - ShopEasy</title>

    <link rel="stylesheet" href="{% static 'store/style.css' %}">

</head>

<body>


<nav class="navbar">

    <div class="navbar-container">

        <a class="logo" href="{% url 'home' %}">
            ShopEasy
        </a>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</nav>


<div class="auth-container">

    <div class="auth-card">

        <h1>
            Create Account
        </h1>


        {% if error %}

        <p style="color: red; margin-bottom: 15px;">
            {{ error }}
        </p>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    class="form-control"
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    class="form-control"
                    type="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    class="form-control"
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <button
                class="btn btn-primary"
                type="submit"
            >
                Create Account
            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
