{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - ShopEasy</title>

    <link rel="stylesheet" href="{% static 'store/style.css' %}">

</head>

<body>


<nav class="navbar">

    <div class="navbar-container">

        <a class="logo" href="{% url 'home' %}">
            ShopEasy
        </a>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'cart' %}">
                🛒 Cart
            </a>

        </div>

    </div>

</nav>


<div class="success-container">

    <div class="success-card">

        <div class="success-icon">
            ✅
        </div>


        <h1>
            Order Placed Successfully!
        </h1>


        <p>
            Thank you for shopping with us.
        </p>


        <p class="order-number">
            Order #{{ order.id }}
        </p>


        <p>
            Total Amount:
            <strong>
                ₹{{ order.total_amount }}
            </strong>
        </p>


        <br>


        <span class="order-status">
            {{ order.status }}
        </span>


        <br><br>


        <a
            class="btn btn-primary"
            href="{% url 'home' %}"
        >
            Continue Shopping
        </a>

    </div>

</div>


<footer class="footer">

    <p>
        © 2026 ShopEasy
    </p>

</footer>

</body>
</html>
